name: daily-pipeline

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 in Cameroon
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to commit the daily output back to the repo

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Phase 1 - Scout trends and plan video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/run_phase1.py
      - name: Phase 2 - Render video
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python src/run_phase2.py
      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-video
          path: output/*-video.mp4
          retention-days: 14
      - name: Publish video to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%F)"
          gh release create "$TAG" output/*-video.mp4 \
            --title "Daily Video $(date -u +%F)" \
            --notes "Automated daily short video: $(head -n 1 output/*-plan.md | sed 's/^# //')" || echo "Release already exists"
      - name: Phase 3 - Upload to YouTube
        if: ${{ secrets.YOUTUBE_TOKEN != '' }}
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: python src/run_phase3.py
      - name: Phase 4 - Upload to TikTok
        if: ${{ secrets.TIKTOK_TOKEN != '' }}
        env:
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
        run: python src/run_phase4.py
      - name: Commit daily plan results
        run: |
          git config user.name "yt-autopilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/*-plan.md output/*-plan.json output/*-trends.json output/.gitkeep
          git commit -m "daily plan $(date -u +%F)" || echo "nothing to commit"
          git push
